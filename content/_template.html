  e usalo come punto di partenza per una scheda vera.
  Il frammento viene iniettato dentro un contenitore .a5-page (148x210mm),
  quindi qui dentro basta il contenuto: niente <html>/<head>/<body>.
  Le schede sono pensate per essere stampate: i link vanno scritti per
  esteso (testo = URL), non solo come testo cliccabile, altrimenti su
  carta sono inutilizzabili.
-->
